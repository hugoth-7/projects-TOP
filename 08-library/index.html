<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Library</title>
    <link rel="stylesheet" href="./style.css">
    <script src="./script.js" defer></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Libertinus+Serif:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="header">
        <div class = "divTitle">
            <p class="title">My Library</p>
            <p class="subtitle">Track the books you want to read, are reading, and have already finished.</p>
        </div>
        <div class= "addBook">
            <button command="show-input"> Add Book</button>
            <dialog id="favDialog">
                <form>
                    <p>
                        <label for="bookTitle">Book title</label>
                        <input id="bookTitle" name="bookTitle" type="text" required />
                    </p>
                    <p>
                        <label for="bookAuthor">Author</label>
                        <input id="bookAuthor" name="bookAuthor" type="text" />
                    </p>
                    <p>
                        <label for="bookPages">Pages</label>
                        <input id="bookPages" name="bookPages" type="number" min="1" required />
                    </p>
                    <p>
                        <label for="bookStatus">Status</label>
                        <select id="bookStatus" name="bookStatus">
                            <option value="finished">Finished</option>
                            <option value="reading">Reading</option>
                            <option value="wishlist">Wishlist</option>
                        </select>
                    </p>
                    <div>
                        <button value="cancel" formmethod="dialog">Cancel</button>
                        <button id="confirmBtn" value="default">Add book</button>
                    </div>
                </form>
            </dialog>
        </div>
    </div>

    <div class="finished">
        <p> Finished </p>
    </div>

    <div class="reading">
        <p> Reading </p>
    </div>

    <div class="wishlist">
        <p> Wishlist </p>
    </div>
</body>
</html>
