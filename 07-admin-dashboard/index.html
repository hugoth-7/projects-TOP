<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <div class="sidebar">
        <div class="logo">
            <img src="./images/sidebar/view-dashboard.svg" alt="logo">
            <p>Dashboard</p>
        </div>
        <div class="menu">
            <div>
                <img src="./images/sidebar/home.svg" alt="home-icon">
                <a href>Home</a>
            </div>
            <div>
                 <img src="./images/sidebar/card-account-details.svg" alt="profile-icon">
                <a href>Profile</a>
            </div>
            <div>
                 <img src="./images/sidebar/message.svg" alt="message-icon">
                <a href>Messages</a>
            </div>
            <div>
                 <img src="./images/sidebar/clock-time-three.svg" alt="history-icon">
                <a href>History</a>
            </div>
            <div>
                 <img src="./images/sidebar/note-multiple.svg" alt="tasks-icon">
                <a href>Tasks</a>
            </div>
            <div>
                 <img src="./images/sidebar/account-group.svg" alt="communities-icon">
                <a href>Communities</a>
            </div>
        </div>
        <div class="settings">
            <div>
                 <img src="./images/sidebar/cog.svg" alt="settings-icon">
                <a href>Settings</a>
            </div>
            <div>
                 <img src="./images/sidebar/help-box.svg" alt="support-icon">
                <a href>Support</a>
            </div>
            <div>
                 <img src="./images/sidebar/shield-check.svg" alt="Privacy">
                <a href>Privacy</a>
            </div>
        </div>
    </div>

    <div class="header">
        <div class="header-top">
            <div class="header-top-left">
                <img src="./images/header/search.svg" alt="search-icon">
                <input type="text">
            </div>
            <div class="header-top-right">
                <img src="./images/header/bell-ring.svg" alt="noti-icon"> 
                <img src="./images/logos/spiderman-logo.png" alt="spiderman-logo">
                <p>Peter Parker</p>
            </div>
        </div>

        <div class="header-bottom">
            <div class="header-bottom-left">
                <img src="./images/logos/spiderman-logo.png" alt="spiderman-logo">
                <div class="header-bottom-left-text">
                    <p>Hi, there</p>
                    <br>
                    <p>Peter Parker (@spiderman)</p>
                </div>
            </div>

            <div class="header-bottom-right">
                <button>New</button>
                <button>Upload</button>
                <button>Share</button>
            </div>
        </div>

    </div>


</body>
</html>
