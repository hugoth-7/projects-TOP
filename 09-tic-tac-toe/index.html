<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic-Tac-Toe</title>
    <link rel="stylesheet" href="./styles.css">
    <script src="./script.js" defer></script>
</head>
<body>
    <div class="game">
        <h1>Tic-Tac-Toe</h1>
        <div class="players">
            <div class="player">
                <label for="player1">Player 1 <span class="mark mark-x">X</span></label>
                <input type="text" id="player1" placeholder="Player 1 name" value="Player 1">
            </div>
            <div class="player">
                <label for="player2">Player 2 <span class="mark mark-o">O</span></label>
                <input type="text" id="player2" placeholder="Player 2 name" value="Player 2">
            </div>
        </div>
        <div class="status">Enter names and press Start Game</div>
        <div class="board"></div>
        <button class="start">Start Game</button>
    </div>
</body>
</html>
